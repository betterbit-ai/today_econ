<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#080c16"/><text x="80" y="120" fill="#4d7cfe" font-family="Pretendard,sans-serif" font-size="34" font-weight="700">DIEM GUIDE 01</text><text x="80" y="255" fill="#f7f9fc" font-family="Pretendard,sans-serif" font-size="86" font-weight="900">우리가 뉴스를</text><text x="80" y="355" fill="#f7f9fc" font-family="Pretendard,sans-serif" font-size="86" font-weight="900">고르는 기준</text><g fill="#c7d1e6" font-family="Pretendard,sans-serif" font-size="42" font-weight="600"><text x="95" y="540">01  내 돈과 생활이 실제로 바뀌는가</text><text x="95" y="660">02  정책·시장·안전의 변화가 있는가</text><text x="95" y="780">03  기사 근거로 끝까지 확인되는가</text><text x="95" y="900">04  한 장만 봐도 사건이 이해되는가</text></g><text x="80" y="1235" fill="#f7f9fc" opacity=".82" font-family="Pretendard,sans-serif" font-size="31" font-weight="600">@diem.magazine</text></svg>
