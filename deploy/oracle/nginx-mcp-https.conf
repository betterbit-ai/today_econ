server {
    listen 80;
    server_name mcp.talkwithme.r-e.kr;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name mcp.talkwithme.r-e.kr;

    ssl_certificate /etc/letsencrypt/live/mcp.talkwithme.r-e.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.talkwithme.r-e.kr/privkey.pem;

    # An 8MB image becomes roughly 10.7MB after Base64 encoding plus JSON.
    client_max_body_size 13m;

    location = /mcp {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering on;
    }

    location / {
        return 404;
    }
}
