name: DIEM Economy

on:
  schedule:
    # Every six hours: 01:00, 07:00, 13:00 and 19:00 Asia/Seoul
    - cron: '0 4,10,16,22 * * *'
    # Weekly encrypted Instagram token rotation (Monday 05:30 KST)
    - cron: '30 20 * * 0'
    # Weekly preauthored DIEM Basic publication (Sunday 09:30 KST)
    - cron: '30 0 * * 0'
  workflow_dispatch:
    inputs:
      operation:
        description: '실행할 경제 매거진 작업'
        required: true
        default: hot_news
        type: choice
        options:
          - hot_news
          - publish_basic
          - retry_basic
          - retry_editorial
          - reissue_news
          - record_moderation
          - collect_insights
      content_id:
        description: 'publish_basic 대상 content_id (비우면 다음 ready 패키지)'
        required: false
        type: string
      publication_key:
        description: 'retry_basic, retry_editorial 또는 record_moderation 대상 publication_key'
        required: false
        type: string
      generated_asset_id:
        description: 'reissue_news에 강제 사용할 검증된 DIEM 생성 이미지 asset id'
        required: false
        type: string
      moderation_action:
        description: 'record_moderation 조치'
        required: false
        type: choice
        options:
          - deleted
          - corrected
      moderation_reason:
        description: '삭제 또는 정정 사유'
        required: false
        type: string

concurrency:
  group: diem-v2-durable-writes
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  PIPELINE_VERSION: v2
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GROQ_PRIMARY_MODEL: openai/gpt-oss-120b
  GROQ_FALLBACK_MODEL: openai/gpt-oss-20b
  GROQ_VISION_MODEL: qwen/qwen3.6-27b
  MAX_DAILY_PUBLICATIONS_PER_CATEGORY: '3'
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
  UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
  SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
  SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
  INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
  INSTAGRAM_TOKEN_ENCRYPTION_KEY: ${{ secrets.INSTAGRAM_TOKEN_ENCRYPTION_KEY }}
  INSTAGRAM_USER_ID: ${{ vars.INSTAGRAM_USER_ID }}
  INSTAGRAM_USERNAME: ${{ vars.INSTAGRAM_USERNAME || 'diem.magazine' }}
  INSTAGRAM_API_VERSION: v23.0
  PUBLISH_INSTAGRAM: 'true'
  PUBLISH_INSTAGRAM_STORY: 'false'
  MANUAL_REEL_STORY_SHARE: 'true'
  GITHUB_TOKEN: ${{ github.token }}
  GITHUB_REPOSITORY: ${{ github.repository }}
  GITHUB_RUN_ID: ${{ github.run_id }}
  GITHUB_SHA: ${{ github.sha }}
  PUBLICATIONS_ROOT: ./data/publications
  EDITORIAL_HISTORY_FILE: ./data/editorial-history.json
  MAX_HISTORY_DAYS: '7'
  HF_HUB_OFFLINE: '1'

jobs:
  publish-economy:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'hot_news') ||
      (github.event_name == 'schedule' && github.event.schedule == '0 4,10,16,22 * * *')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-v2.txt

      - name: Cache multilingual embedding model
        id: embedding-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: diem-minilm-${{ runner.os }}-${{ hashFiles('requirements-v2.txt', 'scripts/topic_similarity.py') }}

      - name: Install pipeline dependencies
        run: |
          npm ci
          python -m pip install -r requirements-v2.txt
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Seed multilingual embedding model cache
        if: steps.embedding-cache.outputs.cache-hit != 'true'
        env:
          HF_HUB_OFFLINE: '0'
        run: python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2')"

      - name: Validate topic similarity calibration
        run: npm run diem:similarity

      - name: Select current hot economy news
        run: node src/v2/index.js select --category economy --slot "$GITHUB_RUN_ID"

      - name: Commit economy selection
        run: bash scripts/commit-diem-state.sh "Select a timely DIEM economy candidate"

      - name: Prepare economy Reel
        run: node src/v2/index.js prepare --category economy

      - name: Commit ready economy state
        run: bash scripts/commit-diem-state.sh "Preserve a ready DIEM economy Reel before publishing"

      - name: Publish economy Reel
        run: node src/v2/index.js publish --category economy

      - name: Commit economy publication result
        run: bash scripts/commit-diem-state.sh "Record the DIEM economy publication outcome"

      - name: Collect due Instagram insights
        continue-on-error: true
        run: |
          node src/cleanup-assets.js
          node src/collect-insights.js
          node src/v2/index.js basic-report
          node src/v2/index.js performance-report

      - name: Commit measurement snapshots
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications data/analytics-state.json data/reports
          if ! git diff --cached --quiet; then
            git commit -m "Retain Instagram growth evidence for editorial decisions" -m "Store due measurement snapshots after the economy polling run.

          Constraint: Keep only two operator-facing publishing workflows
          Confidence: high
          Scope-risk: narrow
          Tested: Scheduled insight collection path
          Not-tested: Metric availability for newly published media"
            git pull --rebase origin "${GITHUB_REF_NAME:-main}"
            git push origin "HEAD:${GITHUB_REF_NAME:-main}"
          fi

  collect-performance-insights:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'collect_insights'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install measurement dependencies
        run: npm ci

      - name: Collect due insights and rebuild performance evidence
        run: |
          node src/collect-insights.js
          node src/v2/index.js basic-report
          node src/v2/index.js performance-report

      - name: Commit measurement snapshots
        run: bash scripts/commit-diem-state.sh "Refresh DIEM performance evidence without publishing"

  retry-editorial-publication:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'retry_editorial'
    runs-on: ubuntu-latest
    steps:
      - name: Require an exact failed publication key
        env:
          EDITORIAL_PUBLICATION_KEY: ${{ inputs.publication_key }}
        run: |
          if [ -z "$EDITORIAL_PUBLICATION_KEY" ]; then
            echo "publication_key is required for retry_editorial" >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install editorial publishing dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Re-run the selected article through safe editorial generation
        env:
          EDITORIAL_PUBLICATION_KEY: ${{ inputs.publication_key }}
        run: node src/v2/index.js editorial-retry --publication-key "$EDITORIAL_PUBLICATION_KEY" --publish

      - name: Commit editorial retry outcome
        if: always()
        run: bash scripts/commit-diem-state.sh "Recover a selected DIEM article after model JSON failure"

  reissue-deleted-news:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'reissue_news'
    runs-on: ubuntu-latest
    steps:
      - name: Require deleted publication and generated asset
        env:
          NEWS_PUBLICATION_KEY: ${{ inputs.publication_key }}
          GENERATED_ASSET_ID: ${{ inputs.generated_asset_id }}
        run: |
          if [ -z "$NEWS_PUBLICATION_KEY" ] || [ -z "$GENERATED_ASSET_ID" ]; then
            echo "publication_key and generated_asset_id are required for reissue_news" >&2
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install publishing dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Reissue deleted news with the reviewed asset
        env:
          NEWS_PUBLICATION_KEY: ${{ inputs.publication_key }}
          GENERATED_ASSET_ID: ${{ inputs.generated_asset_id }}
        run: node src/v2/index.js news-reissue --publication-key "$NEWS_PUBLICATION_KEY" --generated-asset-id "$GENERATED_ASSET_ID" --publish
      - name: Commit news reissue outcome
        if: always()
        run: bash scripts/commit-diem-state.sh "Reissue deleted DIEM news with a reviewed image"

  publish-stored-diem-basic:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'publish_basic') ||
      (github.event_name == 'schedule' && github.event.schedule == '30 0 * * 0')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install publishing dependencies
        run: npm ci

      - name: Publish the next verified stored DIEM Basic package
        env:
          BASIC_CONTENT_ID: ${{ inputs.content_id }}
        run: |
          if [ -n "$BASIC_CONTENT_ID" ]; then
            node src/v2/index.js basic-publish-stored --content-id "$BASIC_CONTENT_ID" --publish
          else
            node src/v2/index.js basic-publish-stored --publish
          fi

      - name: Commit DIEM Basic publication result
        if: always()
        run: bash scripts/commit-diem-state.sh "Record the verified DIEM Basic publication outcome"

  retry-diem-basic:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'retry_basic'
    runs-on: ubuntu-latest
    steps:
      - name: Require an exact publication key
        env:
          BASIC_PUBLICATION_KEY: ${{ inputs.publication_key }}
        run: |
          if [ -z "$BASIC_PUBLICATION_KEY" ]; then
            echo "publication_key is required for retry_basic" >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Retry only independent Story and comment steps
        env:
          BASIC_PUBLICATION_KEY: ${{ inputs.publication_key }}
        run: node src/v2/index.js basic-retry --publication-key "$BASIC_PUBLICATION_KEY" --publish

      - name: Commit DIEM Basic recovery result
        if: always()
        run: bash scripts/commit-diem-state.sh "Recover independent DIEM Basic publishing steps"

  record-moderation:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'record_moderation'
    runs-on: ubuntu-latest
    steps:
      - name: Require moderation metadata
        env:
          MODERATION_PUBLICATION_KEY: ${{ inputs.publication_key }}
          MODERATION_ACTION: ${{ inputs.moderation_action }}
          MODERATION_REASON: ${{ inputs.moderation_reason }}
        run: |
          if [ -z "$MODERATION_PUBLICATION_KEY" ] || [ -z "$MODERATION_ACTION" ] || [ -z "$MODERATION_REASON" ]; then
            echo "publication_key, moderation_action and moderation_reason are required" >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Record deletion or correction
        env:
          MODERATION_PUBLICATION_KEY: ${{ inputs.publication_key }}
          MODERATION_ACTION: ${{ inputs.moderation_action }}
          MODERATION_REASON: ${{ inputs.moderation_reason }}
        run: node src/v2/index.js moderate --publication-key "$MODERATION_PUBLICATION_KEY" --action "$MODERATION_ACTION" --reason "$MODERATION_REASON"

      - name: Commit moderation and report state
        run: bash scripts/commit-diem-state.sh "Preserve an operator deletion or correction reason"

  refresh-token:
    if: github.event_name == 'schedule' && github.event.schedule == '30 20 * * 0'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh and encrypt Instagram token
        run: node src/refresh-instagram-token.js

      - name: Commit rotated encrypted token
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/instagram-token.enc
          if ! git diff --cached --quiet; then
            git commit -m "Keep Instagram automation authenticated without manual rotation" -m "Refresh the long-lived token and persist only its encrypted payload.

          Constraint: GitHub Actions cannot rewrite repository secrets
          Confidence: high
          Scope-risk: narrow
          Tested: Existing token refresh command
          Not-tested: Provider-side expiry beyond the returned lifetime"
            git pull --rebase origin "${GITHUB_REF_NAME:-main}"
            git push origin "HEAD:${GITHUB_REF_NAME:-main}"
          fi
